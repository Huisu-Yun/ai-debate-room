<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 토론방</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div class="room-header">
  <p class="room-topic" id="roomTopic">불러오는 중...</p>
  <div class="chips" id="chips"></div>
  <div class="room-controls">
    <button class="btn-secondary btn-small" id="toggleBtn"><span class="status-dot" id="statusDot"></span><span id="toggleLabel">진행 중</span></button>
    <button class="btn-secondary btn-small" id="shareBtn">🔗 링크 공유</button>
  </div>
</div>

<div class="wrap" style="padding-top:0;">
  <div class="messages" id="messages"></div>
</div>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" placeholder="의견을 입력하세요..." rows="1"></textarea>
    <button class="btn-primary" style="width:auto; margin-top:0;" id="sendBtn">전송</button>
  </div>
</div>

<div class="join-overlay" id="joinOverlay">
  <div class="card join-card">
    <h1 style="margin-top:0;">토론방에 입장하기</h1>
    <p class="sub" id="joinTopicPreview">주제를 불러오는 중...</p>
    <label for="nameInput">사용할 이름</label>
    <input type="text" id="nameInput" maxlength="20" placeholder="예: 희수" />
    <button class="btn-primary" id="joinBtn">입장하기</button>
    <div class="error" id="joinError" style="display:none;"></div>
  </div>
</div>

<script src="/room.js"></script>
</body>
</html>
